[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flask-debugtoolbar-extrapanels"
version = "0.1.0"
description = "Extra panels for Flask-DebugToolbar"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Mario Hernandez" }]
requires-python = ">=3.9"
dependencies = [
    "flask-debugtoolbar>=0.15",
    "blinker>=1.6",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: Flask",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Debuggers",
]

[project.urls]
Homepage = "https://github.com/mariofix/flask-debugtoolbar-extrapanels"

[tool.setuptools.packages.find]
where = ["."]
include = ["flask_debugtoolbar_extrapanels*"]

[tool.setuptools.package-data]
flask_debugtoolbar_extrapanels = ["templates/panels/*.html"]
