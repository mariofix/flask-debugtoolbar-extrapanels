[project]
name = "flask-debugtoolbar-extrapanels"
version = "0.1.0"
description = "A collection of extra panels from Flask-DebugToolbar"
readme = "README.md"
authors = [{ name = "Mario Hernandez", email = "mariofix@proton.me" }]
requires-python = ">=3.10"
dependencies = [
    "flask-debugtoolbar>=0.16.0",
]

[dependency-groups]
dev = [
    "coverage[toml]>=7.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-flask>=1.3",
]

[tool.coverage.run]
source = ["src/flask_debugtoolbar_extrapanels"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
